# Lint, formatting, types and tests on every push to any branch. The "check" job is required to pass before merging into main.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm check, with the tests run under coverage; the report also goes on the run's summary page.
      - run: pnpm lint && pnpm format:check && pnpm typecheck
      - name: Tests with coverage
        shell: bash # -o pipefail: a failing test still fails the step despite tee
        run: |
          pnpm coverage | tee coverage.txt
          { echo '### Test coverage'; echo '```'; sed -n '/start of coverage report/,/end of coverage report/{s/^# //;p}' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
